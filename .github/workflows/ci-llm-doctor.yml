# ---
# 严格真实 LLM provider 健康探针。
# 仅手动或每周计划运行；缺 Key、门禁不足、mock、空响应和业务断言失败都会使 job 失败。
# ---
name: ci-llm-doctor

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "明确选择本次真实探针的 provider（会产生 API 费用）"
        required: true
        default: deepseek
        type: choice
        options:
          - deepseek
          - kimi
          - siliconflow
          - MiniMax
          - openai
          - anthropic
  schedule:
    - cron: "0 6 * * 1"  # 每周一 14:00（北京时间）；计划任务固定使用 deepseek

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  llm-doctor:
    name: "Real API probe: ${{ github.event.inputs.provider || 'deepseek' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_REAL_INTEGRATION: "1"
      LLM_MOCK: "0"
      LLM_PROVIDER: ${{ github.event.inputs.provider || 'deepseek' }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate selected provider secret
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          case "$LLM_PROVIDER" in
            deepseek) key="$DEEPSEEK_API_KEY" ;;
            kimi) key="$KIMI_API_KEY" ;;
            siliconflow) key="$SILICONFLOW_API_KEY" ;;
            MiniMax) key="$MINIMAX_API_KEY" ;;
            openai) key="$OPENAI_API_KEY" ;;
            anthropic) key="$ANTHROPIC_API_KEY" ;;
            *) echo "::error::Unknown LLM_PROVIDER=$LLM_PROVIDER"; exit 2 ;;
          esac
          if [ -z "$key" ]; then
            echo "::error::Selected provider $LLM_PROVIDER has no configured secret; this is not a pass or skip."
            exit 2
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: code/requirements-llm.ci.lock

      - name: Install locked LLM dependencies
        working-directory: code
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-llm.ci.lock

      - name: Run one confirmed real provider probe
        working-directory: code
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/llm_doctor.py --provider "$LLM_PROVIDER" --confirm-real

      - name: Report exact scope
        if: success()
        run: |
          echo "## Real API probe passed" >> "$GITHUB_STEP_SUMMARY"
          echo "Only provider **$LLM_PROVIDER** and its current default model were probed." >> "$GITHUB_STEP_SUMMARY"
