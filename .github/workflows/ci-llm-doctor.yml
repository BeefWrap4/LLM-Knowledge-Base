# ---
# .github/workflows/ci-llm-doctor.yml (Wave 18)
# 真实 LLM API Key 健康检查 — 用 GitHub Secrets
# 配置: Settings → Secrets and variables → Actions → New repository secret
#   DEEPSEEK_API_KEY, KIMI_API_KEY, SILICONFLOW_API_KEY, MINIMAX_API_KEY, OPENAI_API_KEY
# ---
name: ci-llm-doctor

on:
  workflow_dispatch:        # 手动触发 (API 调用扣费, 不自动跑)
  schedule:
    - cron: "0 6 * * 1"    # 每周一 14:00 (北京时间) 跑一次

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false  # 不要取消正在跑的 (避免误扣费)

jobs:
  llm-doctor:
    name: Real LLM API key health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: code/requirements-llm.txt

      - name: Install core + openai SDK
        working-directory: code
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-llm.txt

      - name: Run llm_doctor (with GitHub Secrets)
        working-directory: code
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ] && [ -z "$KIMI_API_KEY" ] && [ -z "$SILICONFLOW_API_KEY" ] && [ -z "$MINIMAX_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::无任何 API Key 配置, 跳过 (在 GitHub Settings → Secrets 配置至少 1 个)"
            echo "passed=skip" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "检测到 API Key, 跑真实调用..."
          python scripts/llm_doctor.py

      - name: Test 1 example with real LLM (DeepSeek)
        working-directory: code
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          USE_REAL_API: "1"
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            python ch13_prompt_engineering/llm/06_self_consistency_cot.py
          else
            echo "::notice::DEEPSEEK_API_KEY 未配置, 跳过"
          fi
