# ---
# .github/workflows/docker-build.yml (Wave 18)
# 自动构建 + 推送 Docker 镜像到 GitHub Container Registry
# 触发: push to master / tag v* / 手动
# ---
name: docker-build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag (default: latest)"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.inputs.tag || 'latest' }},enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PYTHON_VERSION=3.12
            REGISTRY=docker.io
            PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: |
          echo "✓ 镜像已推送: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"

      - name: Test image (smoke)
        # 镜像默认 private, GHCR runner pull 需额外 auth, 这里改为本地 docker build (不推)
        # + 用 image 直接跑 smoke, 跳过 push/pull 的认证环节
        run: |
          echo "Building local test image (same Dockerfile, no push)..."
          docker build \
            --build-arg PYTHON_VERSION=3.12 \
            --build-arg REGISTRY=docker.io \
            --tag llm-kb-smoke:test \
            --file ./Dockerfile \
            --load \
            .
          echo "Running smoke test against local image..."
          docker run --rm \
            -e LLM_MOCK=1 \
            -w /app/code \
            llm-kb-smoke:test \
            python -c "import sys; sys.path.insert(0, '/app/code'); from shared.env import load_env; from shared.gpu_guard import require_nvidia_gpu; print('OK core imports work')"
          docker rmi llm-kb-smoke:test
