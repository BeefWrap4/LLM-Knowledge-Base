# ---
# .github/workflows/verify.yml
# GitHub Actions: 教程 + code 伴侣全量验证
# 触发: push / pull_request / 手动
# ---
name: verify

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:  # 手动触发

# 取消同 branch 上仍在运行的旧 workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1. 快速检查: wiki 链接 + README + smoke (任何 PR 都跑)
  # ============================================================
  quick-check:
    name: Quick check (wiki / README / smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: code/requirements-core.txt

      - name: Install core deps + ML libs
        working-directory: code
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
          # pilot tests 跑 ch*/core/*.py 子进程, 需 torch/sklearn/numpy
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install scikit-learn numpy

      - name: Run verify_all (4 checks)
        working-directory: code
        run: python scripts/verify_all.py

      - name: Run pytest smoke tests
        working-directory: code
        run: pytest tests/ -m "not gpu" -q --tb=short

  # ============================================================
  # 2. 跑通所有 core/ 例子 (~3 min, 任意 ubuntu runner 即可)
  # ============================================================
  core-suite:
    name: Core tier (158 examples)
    runs-on: ubuntu-latest
    needs: quick-check
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: code/requirements-core.txt

      - name: Install core + 轻量额外依赖
        working-directory: code
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu  # CPU-only, ~250MB

      - name: Run all core/ examples
        working-directory: code
        run: python scripts/run_all_examples.py --tier core --parallel 4 --timeout 60

  # ============================================================
  # 3. 跑通所有 llm/ 例子 (~5 min, mock 模式)
  # ============================================================
  llm-suite:
    name: LLM tier (199 examples, mock mode)
    runs-on: ubuntu-latest
    needs: quick-check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: code/requirements-llm.txt

      - name: Install llm tier deps
        working-directory: code
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-llm.txt

      - name: Run all llm/ examples (mock mode)
        working-directory: code
        run: python scripts/run_all_examples.py --tier llm --parallel 4 --timeout 180

  # ============================================================
  # 4. 总结: 全部通过才标绿 ✓
  # ============================================================
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [quick-check, core-suite, llm-suite]
    if: always()
    steps:
      - name: Report status
        run: |
          if [ "${{ needs.quick-check.result }}" == "success" ] && \
             [ "${{ needs.core-suite.result }}" == "success" ] && \
             [ "${{ needs.llm-suite.result }}" == "success" ]; then
            echo "## ✅ All checks passed!" >> $GITHUB_STEP_SUMMARY
            echo "- wiki / README / smoke: PASS" >> $GITHUB_STEP_SUMMARY
            echo "- core/ 158 examples: PASS" >> $GITHUB_STEP_SUMMARY
            echo "- llm/ 199 examples: PASS" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "## ❌ Some checks failed" >> $GITHUB_STEP_SUMMARY
            echo "- quick-check: ${{ needs.quick-check.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- core-suite: ${{ needs.core-suite.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- llm-suite: ${{ needs.llm-suite.result }}" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
