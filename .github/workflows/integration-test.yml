# ---
# 条件性真实集成：本地 embedding + Redis + pgvector + 一个明确的真实 LLM provider。
# 真实计费 job 仅手动/计划运行；缺 Key 或任一组件失败都不会被记为通过。
# ---
name: integration-test

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "明确选择本次真实集成测试的 provider（会产生 API 费用）"
        required: true
        default: deepseek
        type: choice
        options:
          - deepseek
          - kimi
          - siliconflow
          - MiniMax
          - openai
          - anthropic
  schedule:
    - cron: "0 4 * * 0"  # 每周日 12:00（北京时间）；计划任务固定使用 deepseek

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  integration:
    name: "Embedding + Redis + pgvector + ${{ github.event.inputs.provider || 'deepseek' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUN_REAL_INTEGRATION: "1"
      LLM_MOCK: "0"
      LLM_PROVIDER: ${{ github.event.inputs.provider || 'deepseek' }}
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: llmkb
          POSTGRES_PASSWORD: llmkb_test
          POSTGRES_DB: vectordb
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U llmkb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Validate selected provider secret
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          case "$LLM_PROVIDER" in
            deepseek) key="$DEEPSEEK_API_KEY" ;;
            kimi) key="$KIMI_API_KEY" ;;
            siliconflow) key="$SILICONFLOW_API_KEY" ;;
            MiniMax) key="$MINIMAX_API_KEY" ;;
            openai) key="$OPENAI_API_KEY" ;;
            anthropic) key="$ANTHROPIC_API_KEY" ;;
            *) echo "::error::Unknown LLM_PROVIDER=$LLM_PROVIDER"; exit 2 ;;
          esac
          if [ -z "$key" ]; then
            echo "::error::Selected provider $LLM_PROVIDER has no configured secret; this is not a pass or skip."
            exit 2
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: code/requirements-llm.ci.lock

      - name: Install locked integration dependencies
        working-directory: code
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-llm.ci.lock
          pip install llama-index-llms-openai-like

      - name: Validate Redis
        run: |
          pip install --quiet redis psycopg2-binary
          python -c "import redis; r=redis.Redis(host='localhost', port=16379, db=0, socket_connect_timeout=3); assert r.ping(); print('Redis 16379 ready')"

      - name: Validate pgvector
        run: |
          python -c "import psycopg2; c=psycopg2.connect(host='localhost', port=15432, user='llmkb', password='llmkb_test', dbname='vectordb'); c.autocommit=True; c.cursor().execute('CREATE EXTENSION IF NOT EXISTS vector'); c.close(); print('pgvector 15432 ready')"

      - name: Download the one required embedding model
        working-directory: code
        env:
          HF_ENDPOINT: https://hf-mirror.com
        run: |
          python scripts/download_models.py --embedding

      - name: Run strict four-component integration
        working-directory: code
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDIS_HOST: localhost
          PG_HOST: localhost
        run: |
          python scripts/test_integration.py

      - name: Report exact scope
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## Four-component integration passed" >> "$GITHUB_STEP_SUMMARY"
            echo "Validated bge-small-zh-v1.5, Redis, pgvector, and provider **$LLM_PROVIDER** only." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Integration failed or was not executed" >> "$GITHUB_STEP_SUMMARY"
            echo "No skipped or incomplete run is reported as a pass." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
