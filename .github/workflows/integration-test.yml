# ---
# .github/workflows/integration-test.yml (Wave 31 + W8)
# 集成测试 workflow — 验证 4 项真实组件 (Embedding + Redis + pgvector + LLM)
#                + 真实 API 冒烟 (10 个代表性 LLM tier 文件, 仅 push/schedule/manual)
# 触发: push to master / PR / schedule (周日 04:00 UTC) / 手动
# 需 GitHub Secrets: DEEPSEEK_API_KEY 等 (run_real_demos 同样需要)
# ---
name: integration-test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:        # 手动触发
  schedule:
    - cron: "0 4 * * 0"      # 每周日 12:00 (北京时间) 跑一次

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  integration:
    name: 4 项集成测试 (本地栈)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # 内置 Redis (Ubuntu 自带, 启动快)
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # 内置 pgvector (Aliyun 镜像加速国内)
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: llmkb
          POSTGRES_PASSWORD: llmkb_test
          POSTGRES_DB: vectordb
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U llmkb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: code/requirements-llm.txt

      - name: 安装依赖 (core + llm + llama_index)
        working-directory: code
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-llm.txt
          pip install llama-index-llms-openai-like

      - name: 启动 Redis 健康检查
        run: |
          # ubuntu-latest 不预装 redis-cli / postgresql-client, 先用 Python 装客户端
          pip install --quiet redis psycopg2-binary
          sleep 5
          python -c "import redis; r=redis.Redis(host='localhost', port=16379, db=0, socket_connect_timeout=3); print('  PING:', r.ping())"
          echo "  ✓ Redis 16379 ready"

      - name: 启动 pgvector 健康检查
        run: |
          sleep 10
          python -c "import psycopg2; c=psycopg2.connect(host='localhost', port=15432, user='llmkb', password='llmkb_test', dbname='vectordb'); c.autocommit=True; c.cursor().execute('CREATE EXTENSION IF NOT EXISTS vector'); c.close(); print('  ✓ pgvector 15432 ready')"

      - name: 下载真实模型 (国内源, 3 个 required 模型, ~1.7GB)
        working-directory: code
        env:
          HF_ENDPOINT: https://hf-mirror.com
        run: |
          # 用 --required-only 避免触发 auth-gated 16GB Llama 模型
          python scripts/download_models.py --required-only

      - name: "跑集成测试 (4 项: Embedding + Redis + pgvector + LLM)"
        working-directory: code
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # CI 端用 localhost (service 名称), 不是 127.0.0.1
          REDIS_HOST: localhost
          PG_HOST: localhost
        run: |
          python scripts/test_integration.py

      - name: 报告
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "## ✅ 集成测试全部通过" >> $GITHUB_STEP_SUMMARY
            echo "本地部署栈 (Redis + pgvector + 3 模型 + 4 厂商 LLM) 完整可用" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ 集成测试失败" >> $GITHUB_STEP_SUMMARY
            echo "排查: code/docs/DEPLOY_LOCAL.md §9 故障排查" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  # ============================================================
  # 2. 真实 API 冒烟 (10 个代表性 LLM tier 文件)
  # 触发: push to master / schedule / workflow_dispatch (跳过 PR check)
  # ============================================================
  real-api-smoke:
    name: 真实 API 冒烟 (10 个代表性 LLM tier)
    runs-on: ubuntu-latest
    needs: integration  # 在 4 项集成测试后跑
    timeout-minutes: 20
    env:
      LLM_MOCK: "0"  # 显式 unset (与 1 互斥)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements-llm.txt

      - name: 安装依赖 (llm tier)
        working-directory: code
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-llm.txt

      - name: 真实 API 冒烟 (需 DEEPSEEK_API_KEY)
        working-directory: code
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # CI 环境标记 (verify_all.py 会友好提示)
          CI: "true"
        run: |
          python scripts/test_real_api_smoke.py

      - name: 报告
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "## ✅ 真实 API 冒烟通过" >> $GITHUB_STEP_SUMMARY
            echo "10 个代表性 LLM tier 文件均调通真实 API" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ 真实 API 冒烟失败" >> $GITHUB_STEP_SUMMARY
            echo "排查: 1) DEEPSEEK_API_KEY 是否过期; 2) 网络是否通 DeepSeek" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
