# ---
# .github/workflows/gpu-verify.yml
# GPU tier 验证 — 需 self-hosted runner (带 NVIDIA GPU)
# 默认不自动跑, 手动触发 (workflow_dispatch) 或在 self-hosted runner 上
# actions/* v6/v7 需要 Actions Runner >= 2.327.1
# ---
name: gpu-verify

on:
  workflow_dispatch:  # 手动触发

jobs:
  gpu-suite:
    name: CUDA dependency + 76 offline GPU contracts
    runs-on: [self-hosted, gpu]  # 需 self-hosted runner 带 GPU 标签
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: code/requirements-gpu.ci.lock

      - name: Install gpu tier deps
        working-directory: code
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gpu.ci.lock

      - name: Verify GPU
        run: |
          nvidia-smi
          python -c "import torch; assert torch.cuda.is_available(); print('CUDA OK:', torch.cuda.get_device_name(0))"

      - name: Run all gpu/ contracts (explicit mock/skip mode)
        working-directory: code
        run: python scripts/run_all_examples.py --tier gpu --parallel 1 --timeout 120
        # parallel=1 避免 GPU 争用
