# ---
# docker-compose.yml (Wave 14-C)
# 多 profile 部署: core (基础) / llm (含 Redis) / gpu (NVIDIA)
# Usage:
#   docker compose --profile core up -d              # 仅 app
#   docker compose --profile llm up -d              # + Redis
#   docker compose --profile gpu up -d              # + GPU + Redis
#   docker compose --profile core run --rm app bash # 临时进容器
# ---
name: llm-knowledge-base

# 统一环境变量 (从 .env 自动加载, 也可在此覆盖)
x-app-env: &app-env
  PYTHONUNBUFFERED: "1"
  LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
  HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  KIMI_API_KEY: ${KIMI_API_KEY:-}
  SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  # ─────────────────────────────────────────────────────────
  # app — 核心服务, 永远启动
  # ─────────────────────────────────────────────────────────
  app:
    image: llm-kb:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.12"
        # 国内源 (删除此行 = 用 docker.io)
        REGISTRY: ${DOCKER_REGISTRY:-docker.io}
    container_name: llm-kb-app
    restart: unless-stopped
    env_file:
      - path: .env           # 用户的 .env (可选, 优先级低于显式 env)
        required: false
    environment:
      <<: *app-env
    volumes:
      - ./code:/app/code:ro                 # 代码只读挂载 (本地开发热更新)
      - ./code/models:/app/code/models:rw   # 模型目录读写 (用户下载)
      - app-cache:/home/app/.cache          # HF / pip 缓存
    networks:
      - llm-net
    profiles: [core, llm, gpu]

  # ─────────────────────────────────────────────────────────
  # redis — LangGraph checkpoint / Langfuse cache (llm profile 启动)
  # ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: llm-kb-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly yes
    ports:
      - "16379:6379"          # 宿主 16379 → 容器 6379 (避免与系统 redis 冲突)
    volumes:
      - redis-data:/data
    networks:
      - llm-net
    profiles: [llm, gpu]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ─────────────────────────────────────────────────────────
  # postgres — RAG 向量库 (进阶 profile, 默认不启动)
  # ─────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: llm-kb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: llmkb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: vectordb
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - llm-net
    profiles: [gpu]  # 进阶 profile, gpu 才有 pgvector
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmkb"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  app-cache:
  redis-data:
  pg-data:

networks:
  llm-net:
    driver: bridge
